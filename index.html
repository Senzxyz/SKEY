<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenzyHub - Premium Key System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
        .neon-glow { box-shadow: 0 0 50px rgba(168, 85, 247, 0.12), 0 0 100px rgba(236, 72, 153, 0.08); }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="text-zinc-100 flex flex-col items-center justify-center min-h-screen relative overflow-x-hidden selection:bg-blue-500 selection:text-white p-4">

    <!-- แสงนีออนพื้นหลัง -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/10 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/10 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- แบนเนอร์แจ้งเตือนด้านบนสุด -->
    <div class="w-full max-w-lg mb-4 flex flex-col sm:flex-row items-center justify-between bg-zinc-900/60 border border-zinc-800/80 px-4 py-2.5 rounded-2xl text-xs text-zinc-400 gap-2 z-20 backdrop-blur-md">
        <span>⚡ Logged-in users save keys automatically to MyKey Dashboard.</span>
        <div id="auth-action-btn">
            <button onclick="loginWithDiscord()" class="text-blue-400 hover:text-blue-300 font-semibold transition cursor-pointer">Log in</button>
        </div>
    </div>

    <!-- กล่องหลักระดับโปร -->
    <div class="bg-[#111827]/80 backdrop-blur-2xl p-7 rounded-3xl shadow-2xl w-full max-w-lg border border-zinc-800/80 relative z-10 neon-glow">
        
        <!-- ส่วนหัว Service & Logo -->
        <div class="flex items-center justify-between pb-5 border-b border-zinc-800/80 mb-5">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl blur opacity-70"></div>
                    <img src="https://raw.githubusercontent.com/senzxyz2xxx/SenzyHub/refs/heads/main/senz2.png" alt="Logo" class="relative w-12 h-12 object-contain rounded-xl bg-zinc-950 border border-zinc-800 p-1.5">
                </div>
                <div>
                    <span class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold block">Service</span>
                    <h1 class="text-lg font-extrabold text-white tracking-tight">SenzyHub</h1>
                </div>
            </div>
            <a href="https://discord.gg/ลิงก์ดิสวัดของมึง" target="_blank" class="text-xs text-zinc-400 hover:text-white transition flex items-center gap-1 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-xl">
                <span>HOW TO GET KEY?</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </a>
        </div>

        <!-- สถานะ Checkpoint -->
        <div class="flex items-center gap-2 mb-6">
            <span id="checkpoint-badge" class="bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-bold px-3 py-1 rounded-lg">CHECKPOINT 1 / 2</span>
            <span id="checkpoint-status" class="text-xs text-zinc-400 font-medium">IN PROGRESS</span>
        </div>

        <!-- กล่องคำคม / Daily Push -->
        <div class="bg-zinc-950/60 border border-zinc-800/60 p-4 rounded-2xl mb-6">
            <span class="text-[10px] uppercase tracking-wider text-zinc-500 font-bold block mb-1">DAILY PUSH</span>
            <p class="text-xs text-zinc-300 italic font-medium">"Discipline beats motivation. You showed up; that already puts you ahead."</p>
        </div>

        <!-- ตัวสลับผู้ให้บริการโฆษณา (Ad Provider Switcher) -->
        <div class="flex items-center justify-between bg-zinc-950/80 border border-zinc-800 p-3 rounded-2xl mb-6">
            <span class="text-xs text-zinc-400 font-medium flex items-center gap-1.5">
                <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Current:
            </span>
            <div class="flex items-center gap-2">
                <button id="provider-primary" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-md transition cursor-pointer">Linkvertise <span class="text-[10px] opacity-70 font-normal">(Primary)</span></button>
                <button id="provider-secondary" onclick="switchProvider()" class="bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer">Switch to Lockr.so</button>
            </div>
        </div>

        <!-- พื้นที่แสดงคอนเทนต์หลัก / ปุ่มกดรับคีย์ -->
        <div id="content-box">
            <button onclick="doNextStep()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white py-3.5 rounded-2xl font-bold transition duration-300 shadow-lg shadow-blue-500/20 btn-glow cursor-pointer flex items-center justify-center gap-2 text-sm">
                <span id="main-btn-text">Continue to Next Step</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </div>

        <!-- ฟุตเตอร์ลิงก์เสริม (Reset HWID) -->
        <div class="mt-6 pt-4 border-t border-zinc-800/80 flex items-center justify-between text-xs text-zinc-500">
            <button onclick="resetHwidModal()" class="hover:text-zinc-300 transition underline decoration-zinc-700 cursor-pointer">Already have a key? Reset HWID</button>
            <span id="hwid-status-label" class="font-mono text-[10px] text-zinc-600">HWID: Checking...</span>
        </div>
    </div>

    <!-- ลิงก์ซัพพอร์ตด้านล่างสุด -->
    <div class="mt-6 text-xs text-zinc-500 flex items-center gap-1.5 z-20">
        <span>Need help?</span>
        <a href="https://discord.gg/ลิงก์ดิสวัดของมึง" target="_blank" class="text-blue-400 hover:text-blue-300 font-semibold transition underline decoration-blue-500/40">Join our Discord</a>
    </div>

    <script>
        let db;
        let ADMIN_DISCORD_ID = "";
        let hwid = new URLSearchParams(window.location.search).get('hwid');
        let currentProvider = 'linkvertise';

        function switchProvider() {
            currentProvider = currentProvider === 'linkvertise' ? 'lockr' : 'linkvertise';
            const btn1 = document.getElementById('provider-primary');
            const btn2 = document.getElementById('provider-secondary');
            if(currentProvider === 'linkvertise') {
                btn1.innerHTML = `Linkvertise <span class="text-[10px] opacity-70 font-normal">(Primary)</span>`;
                btn1.className = "bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-md transition cursor-pointer";
                btn2.innerText = "Switch to Lockr.so";
                btn2.className = "bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer";
            } else {
                btn2.innerHTML = `Lockr.so <span class="text-[10px] opacity-70 font-normal">(Primary)</span>`;
                btn2.className = "bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-md transition cursor-pointer";
                btn1.innerText = "Switch to Linkvertise";
                btn1.className = "bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer";
            }
        }

        async function initApp() {
            try {
                const res = await fetch('/api');
                const config = await res.json();
                
                if (!config.supabaseUrl || !config.supabaseAnonKey) {
                    console.error("Config missing");
                    return;
                }

                ADMIN_DISCORD_ID = config.adminUuid;
                db = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                if (window.location.hash && window.location.hash.includes('access_token')) {
                    window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
                }

                const { data: { session } } = await db.auth.getSession();
                const authBtnDiv = document.getElementById('auth-action-btn');

                if (session && session.user) {
                    const user = session.user;
                    const metadata = user.user_metadata || {};
                    const username = metadata.full_name || metadata.name || metadata.custom_name || metadata.preferred_username || user.email?.split('@')[0] || 'User';
                    const avatar = metadata.avatar_url || metadata.picture || metadata.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=3b82f6&color=fff&bold=true`;
                    
                    authBtnDiv.innerHTML = `
                        <div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-xl text-xs font-semibold text-zinc-200">
                            <img src="${avatar}" class="w-5 h-5 rounded-full object-cover border border-zinc-700">
                            <span class="max-w-[80px] truncate">${username}</span>
                            <button onclick="logoutUser()" class="text-red-400 hover:text-red-300 ml-1 cursor-pointer font-bold">Sign Out</button>
                        </div>
                    `;

                    const discordId = user.identities?.[0]?.id || metadata.provider_id || user.id;
                    if (ADMIN_DISCORD_ID && String(discordId) === String(ADMIN_DISCORD_ID)) {
                        renderAdminPanel(user);
                        return;
                    }
                }

                if (!hwid) {
                    document.getElementById('checkpoint-badge').innerText = "ERROR";
                    document.getElementById('checkpoint-status').innerText = "HWID MISSING";
                    document.getElementById('content-box').innerHTML = `
                        <div class="bg-red-500/10 border border-red-500/20 text-red-300 p-4 rounded-2xl text-xs leading-relaxed text-center">
                            กรุณารันสคริปต์จากในเกม Roblox แล้วกดปุ่ม <b>Get Key</b> เพื่อเข้าสู่ระบบผ่านลิงก์ที่ถูกต้องเท่านั้น!
                        </div>
                    `;
                    document.getElementById('hwid-status-label').innerText = "HWID: Not Found";
                    return;
                }

                document.getElementById('hwid-status-label').innerText = "HWID: " + hwid.substring(0, 8) + "...";

                let { data: existingKey } = await db.from('keys').select('*').eq('hwid', hwid).single();

                if (existingKey && existingKey.key_string && existingKey.key_string !== 'TEMP' && (!existingKey.expires_at || new Date(existingKey.expires_at) > new Date())) {
                    document.getElementById('checkpoint-badge').innerText = "SUCCESS";
                    document.getElementById('checkpoint-status').innerText = "KEY ACTIVE";
                    document.getElementById('content-box').innerHTML = `
                        <div class="bg-zinc-950 border border-zinc-800 p-4 rounded-2xl font-mono text-blue-400 mb-4 select-all break-all text-center text-sm shadow-inner">${existingKey.key_string}</div>
                        <button onclick="navigator.clipboard.writeText('${existingKey.key_string}'); alert('คัดลอกคีย์เรียบร้อย!')" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white py-3.5 rounded-2xl font-bold transition duration-300 shadow-lg shadow-blue-500/20 btn-glow cursor-pointer">Copy Key</button>
                    `;
                } else {
                    let step = existingKey ? existingKey.step : 0;
                    document.getElementById('checkpoint-badge').innerText = `CHECKPOINT ${Math.min(step + 1, 2)} / 2`;
                    document.getElementById('checkpoint-status').innerText = "IN PROGRESS";
                }

            } catch (err) {
                console.error("Init Error:", err);
            }
        }

        async function doNextStep() {
            if (!hwid) return alert("ไม่พบ HWID!");
            let { data: existing } = await db.from('keys').select('*').eq('hwid', hwid).single();

            let nextStep = existing ? (existing.step || 0) + 1 : 1;

            if (!existing) {
                await db.from('keys').insert([{ hwid: hwid, step: 1, key_string: 'TEMP' }]);
            } else {
                if (nextStep >= 2) {
                    const randomKey = 'SENZ-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                    const expireTime = new Date(Date.now() + 12 * 60 * 60 * 1000);

                    await db.from('keys').update({
                        step: 2,
                        key_string: randomKey,
                        expires_at: expireTime.toISOString()
                    }).eq('hwid', hwid);
                } else {
                    await db.from('keys').update({ step: nextStep }).eq('hwid', hwid);
                }
            }

            alert(`กำลังพาส่งไปยังผู้ให้บริการ (${currentProvider.toUpperCase()})... ผ่านสำเร็จ!`);
            location.reload();
        }

        async function loginWithDiscord() {
            const { error } = await db.auth.signInWithOAuth({
                provider: 'discord',
                options: { redirectTo: window.location.origin }
            });
            if (error) alert("Login Error: " + error.message);
        }

        async function logoutUser() {
            await db.auth.signOut();
            location.href = window.location.origin;
        }

        function resetHwidModal() {
            const inputHwid = prompt("กรุณากรอก HWID ที่คุณต้องการรีเซ็ต:");
            if(inputHwid) {
                alert("ส่งคำขอรีเซ็ต HWID เรียบร้อย!");
            }
        }

        async function renderAdminPanel(user) {
            document.getElementById('checkpoint-badge').innerText = "ADMIN PANEL";
            document.getElementById('checkpoint-status').innerText = `OWNER: ${user.user_metadata?.full_name || 'Admin'}`;
            
            let { data: keys } = await db.from('keys').select('*').order('id', { ascending: false });

            let rows = '';
            if (keys) {
                keys.forEach(k => {
                    rows += `<tr class="border-b border-zinc-800 text-xs">
                        <td class="p-2 font-mono text-blue-400">${k.key_string}</td>
                        <td class="p-2 text-zinc-400 truncate max-w-[100px]">${k.hwid || 'Custom'}</td>
                        <td class="p-2"><button onclick="deleteKey('${k.id}')" class="text-red-400 hover:text-red-300 font-bold cursor-pointer">ลบ</button></td>
                    </tr>`;
                });
            }

            document.getElementById('content-box').innerHTML = `
                <div class="mb-4 text-left">
                    <label class="text-xs text-zinc-400 block mb-1 font-semibold">สร้าง Custom Key (ถาวร)</label>
                    <input type="text" id="custom-key-input" placeholder="SENZ-PRO-xxxx" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white mb-2 focus:outline-none focus:border-blue-500">
                    <button onclick="createCustomKey()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-xs font-bold transition cursor-pointer text-white shadow-md">สร้างคีย์นี้</button>
                </div>
                <div class="max-h-40 overflow-y-auto border border-zinc-800 rounded-xl mb-4 bg-zinc-950/40">
                    <table class="w-full text-left">
                        <tr class="border-b border-zinc-800 text-xs text-zinc-500 bg-zinc-900/80 sticky top-0">
                            <th class="p-2">Key</th>
                            <th class="p-2">HWID</th>
                            <th class="p-2">Action</th>
                        </tr>
                        ${rows}
                    </table>
                </div>
                <button onclick="logoutUser()" class="w-full bg-zinc-800 hover:bg-zinc-700 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer text-zinc-200">ออกจากระบบแอดมิน</button>
            `;
        }

        async function createCustomKey() {
            const val = document.getElementById('custom-key-input').value.trim();
            if (!val) return alert("กรุณาใส่ชื่อคีย์ให้ถูกต้อง!");

            let { error } = await db.from('keys').insert([{ key_string: val, step: 2 }]);
            if (error) alert("เกิดข้อผิดพลาด: " + error.message);
            else { alert("สร้างคีย์สำเร็จ!"); initApp(); }
        }

        async function deleteKey(id) {
            if (!confirm("ต้องการลบคีย์นี้ใช่ไหม?")) return;
            await db.from('keys').delete().eq('id', id);
            initApp();
        }

        initApp();
    </script>
</body>
</html>
