<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenzyHub - Premium Key System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .neon-glow {
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.15), 0 0 80px rgba(168, 85, 247, 0.1);
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-zinc-100 flex items-center justify-center min-h-screen relative overflow-hidden selection:bg-pink-500 selection:text-white">

    <!-- แสงนีออนพื้นหลังชมพู-ม่วงฟุ้งๆ -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-pink-600/20 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/20 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="bg-zinc-900/70 backdrop-blur-2xl p-8 rounded-3xl shadow-2xl w-full max-w-md border border-zinc-800/80 text-center relative z-10 neon-glow">
        
        <!-- โลโก้ของคุณ (ขอบเรืองแสงชมพูม่วง) -->
        <div class="flex justify-center mb-5">
            <div class="relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-2xl blur opacity-70 group-hover:opacity-100 transition duration-300"></div>
                <img src="https://raw.githubusercontent.com/senzxyz2xxx/SenzyHub/refs/heads/main/senz2.png" alt="Senzy Logo" class="relative w-20 h-20 object-contain rounded-2xl p-2 bg-zinc-950 border border-zinc-800">
            </div>
        </div>

        <h1 class="text-2xl font-extrabold tracking-tight mb-1 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">SenzyHub Verification</h1>
        <p id="status-text" class="text-zinc-400 text-sm mb-6">กำลังตรวจสอบ HWID เครื่องของคุณ...</p>

        <div id="content-box">
            <!-- คอนเทนต์แสดงผล -->
        </div>

        <!-- ปุ่มซื้อคีย์ถาวร / ลิงก์เข้า Discord -->
        <div class="mt-8 pt-6 border-t border-zinc-800/80 text-xs text-zinc-500 flex items-center justify-center gap-1">
            <span>สนใจซื้อคีย์ถาวร / 7 วัน?</span> 
            <a href="https://discord.gg/ลิงก์ดิสวัดของมึง" target="_blank" class="text-pink-400 hover:text-pink-300 font-semibold transition underline decoration-pink-500/50">ติดต่อ Discord</a>
        </div>
    </div>

    <!-- โหลดไฟล์ Config แยก (สำหรับคนใช้ Git) หรือมึงใส่ค่าตรงนี้ได้เลย -->
    <script src="./config.js"></script>

    <script>
        // เผื่อลืมสร้าง config.js ให้ใส่ค่าสำรองตรงนี้ได้ หรือดึงจาก window.ENV
        const SUPABASE_URL = window.ENV ? window.ENV.SUPABASE_URL : "ใส่_URL_ตรงนี้ถ้าไม่ใช้ไฟล์ config";
        const SUPABASE_ANON_KEY = window.ENV ? window.ENV.SUPABASE_ANON_KEY : "ใส่_ANON_KEY_ตรงนี้ถ้าไม่ใช้ไฟล์ config";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const hwid = urlParams.get('hwid');

        const statusText = document.getElementById('status-text');
        const contentBox = document.getElementById('content-box');

        async function init() {
            if (!hwid) {
                statusText.innerText = "ไม่พบรหัสฮาร์ดแวร์ (HWID)";
                contentBox.innerHTML = `
                    <div class="bg-pink-500/10 border border-pink-500/20 text-pink-300 p-4 rounded-2xl text-sm leading-relaxed">
                        กรุณารันสคริปต์จากในเกม Roblox แล้วกดปุ่ม <b>Get Key</b> เพื่อเข้าสู่ระบบผ่านลิงก์ที่ถูกต้องเท่านั้น!
                    </div>
                `;
                return;
            }

            let { data: existingKey, error } = await supabase
                .from('keys')
                .select('*')
                .eq('hwid', hwid)
                .single();

            if (existingKey && existingKey.key_string && existingKey.key_string !== 'TEMP' && (!existingKey.expires_at || new Date(existingKey.expires_at) > new Date())) {
                statusText.innerText = "คีย์ของคุณใช้งานได้ปกติ:";
                contentBox.innerHTML = `
                    <div class="bg-zinc-950/80 border border-zinc-800/80 p-4 rounded-2xl font-mono text-pink-400 mb-4 select-all break-all text-sm shadow-inner tracking-wider">${existingKey.key_string}</div>
                    <button onclick="navigator.clipboard.writeText('${existingKey.key_string}'); alert('คัดลอกคีย์เรียบร้อย!')" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 py-3.5 rounded-2xl font-bold transition duration-300 shadow-lg shadow-pink-500/25 btn-glow cursor-pointer text-white">คัดลอกคีย์</button>
                `;
            } else {
                let step = existingKey ? existingKey.step : 0;
                statusText.innerText = `สถานะความคืบหน้า: ทำภารกิจรอบที่ ${step}/2`;

                if (step === 0 || step === 1) {
                    contentBox.innerHTML = `
                        <button onclick="doLink(${step + 1})" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 py-3.5 rounded-2xl font-bold transition duration-300 shadow-lg shadow-pink-500/25 btn-glow cursor-pointer text-white flex items-center justify-center gap-2">
                            <span>ดูโฆษณารอบที่ ${step + 1} (Linkvertise)</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        </button>
                    `;
                }
            }
        }

        async function doLink(nextStep) {
            let { data: existing } = await supabase.from('keys').select('*').eq('hwid', hwid).single();

            if (!existing) {
                await supabase.from('keys').insert([{ hwid: hwid, step: 1, key_string: 'TEMP' }]);
            } else {
                if (nextStep === 2) {
                    const randomKey = 'SENZ-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                    const expireTime = new Date(Date.now() + 12 * 60 * 60 * 1000);

                    await supabase.from('keys').update({
                        step: 2,
                        key_string: randomKey,
                        expires_at: expireTime.toISOString()
                    }).eq('hwid', hwid);
                } else {
                    await supabase.from('keys').update({ step: nextStep }).eq('hwid', hwid);
                }
            }

            alert("ผ่านลิงก์สำเร็จ! กำลังโหลดหน้าคีย์...");
            location.reload();
        }

        init();
    </script>
</body>
</html>
